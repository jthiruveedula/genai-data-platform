name: Deploy site to GitHub Pages

# Deploys only on a published GitHub Release (a tag, e.g. v1.4.0) — not on
# every push to main. main can carry several merged, CI-passed PRs ahead of
# what's actually live; a release is the deliberate "these merged changes go
# live now" gate. workflow_dispatch remains for a manual re-run of whatever
# ref is currently checked out (e.g. retrying a flaky Pages deploy of the
# same release), not for shipping unreleased main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
