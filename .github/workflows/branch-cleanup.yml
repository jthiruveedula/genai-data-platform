name: Delete stale merged branches

# Weekly hygiene: remove remote branches that are already merged into main
# and haven't been touched in 30+ days. Only ever considers branches git
# itself reports as merged (--merged), so an open PR's branch — merged or
# not — is never a candidate unless main already contains all its commits.
# workflow_dispatch is included for an on-demand run without waiting for
# the schedule.
on:
  schedule:
    - cron: "0 3 * * 1" # every Monday, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete merged branches older than 30 days
        run: |
          set -euo pipefail
          CUTOFF=$(date -d '30 days ago' +%s)
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          git for-each-ref --format='%(refname:short)' "refs/remotes/origin" \
            | sed 's#^origin/##' \
            | grep -vxF "$DEFAULT_BRANCH" \
            | grep -vxF "HEAD" \
            > /tmp/all-branches.txt || true

          git branch -r --merged "origin/$DEFAULT_BRANCH" \
            | sed 's#^[[:space:]]*origin/##' \
            | grep -vxF "$DEFAULT_BRANCH" \
            > /tmp/merged-branches.txt || true

          {
            echo "### Stale branch cleanup"
            echo ""
            echo "| Branch | Last commit | Merged into $DEFAULT_BRANCH | Action |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          deleted_count=0
          kept_count=0

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            last_commit=$(git log -1 --format=%ct "origin/$branch")
            last_commit_human=$(date -d "@$last_commit" -Iseconds)

            if ! grep -qxF "$branch" /tmp/merged-branches.txt; then
              echo "Keeping $branch — not merged into $DEFAULT_BRANCH"
              echo "| \`$branch\` | $last_commit_human | no | kept (unmerged) |" >> "$GITHUB_STEP_SUMMARY"
              kept_count=$((kept_count + 1))
              continue
            fi

            if [ "$last_commit" -lt "$CUTOFF" ]; then
              echo "Deleting stale merged branch: $branch (last commit $last_commit_human)"
              if git push origin --delete "$branch"; then
                echo "| \`$branch\` | $last_commit_human | yes | **deleted** |" >> "$GITHUB_STEP_SUMMARY"
                deleted_count=$((deleted_count + 1))
              else
                echo "::warning::Failed to delete $branch (may be protected or already gone)"
                echo "| \`$branch\` | $last_commit_human | yes | delete failed |" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Keeping $branch — merged but last commit within 30 days"
              echo "| \`$branch\` | $last_commit_human | yes | kept (< 30 days old) |" >> "$GITHUB_STEP_SUMMARY"
              kept_count=$((kept_count + 1))
            fi
          done < /tmp/all-branches.txt

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$deleted_count deleted, $kept_count kept.**" >> "$GITHUB_STEP_SUMMARY"
